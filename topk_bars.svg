<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="800" height="210" role="img" aria-label="Time to build a top 230 queue from 284,807 transactions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#24292f}
    .s{font-family:Segoe UI,Arial,sans-serif;font-size:12px;fill:#57606a}
    @media (prefers-color-scheme: dark){.t{fill:#e6edf3}.s{fill:#9da7b3}}
  </style>
  <text class="t" x="10" y="24" font-weight="700">Time to build the top 230 queue (284,807 shuffled transactions)</text>
  <text class="s" x="10" y="42">Shorter bar is faster. Bars use the same scale.</text>
  <text class="t" x="10" y="82">Size-K min-heap</text>
  <rect x="190" y="66" height="22" rx="3" fill="#2e7d32"><animate attributeName="width" from="0" to="6" dur="1s" fill="freeze"/></rect>
  <text class="t" x="206" y="82">0.0030 s</text>
  <text class="t" x="10" y="130">Full sort, take K</text>
  <rect x="190" y="114" height="22" rx="3" fill="#1565c0"><animate attributeName="width" from="0" to="180" dur="1.6s" fill="freeze"/></rect>
  <text class="t" x="378" y="130">0.174 s</text>
  <text class="t" x="10" y="178">Bounded insertion buffer</text>
  <rect x="190" y="162" height="22" rx="3" fill="#c62828"><animate attributeName="width" from="0" to="500" dur="2.2s" fill="freeze"/></rect>
  <text class="t" x="698" y="178">0.483 s</text>
</svg>
