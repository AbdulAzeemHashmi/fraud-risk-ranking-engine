<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Fraud Risk Ranking Engine banner with animated risk bars" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#143d6b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4fc3f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <g transform="translate(40,0)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="92" font-size="40" font-weight="700" fill="#ffffff">Fraud Risk Ranking Engine</text>
    <text x="0" y="128" font-size="17" fill="#b9d4f0">Rank card transactions by risk. Show the riskiest ones first.</text>
    <text x="0" y="166" font-size="14" fill="#7fb4ea">C++17  |  Full sorts  |  Top K queue  |  Live feed</text>
  </g>
  <g transform="translate(610,190)">
    <rect x="0"   y="-40"  width="26" height="40"  rx="3" fill="#4fc3f7"><animate attributeName="height" values="40;20;40" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="-40;-20;-40" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="34"  y="-70"  width="26" height="70"  rx="3" fill="#4fc3f7"><animate attributeName="height" values="70;110;70" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="-70;-110;-70" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="68"  y="-90"  width="26" height="90"  rx="3" fill="#4fc3f7"><animate attributeName="height" values="90;60;90" dur="3.1s" repeatCount="indefinite"/><animate attributeName="y" values="-90;-60;-90" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="102" y="-60"  width="26" height="60"  rx="3" fill="#ffb74d"><animate attributeName="height" values="60;100;60" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="-60;-100;-60" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="136" y="-120" width="26" height="120" rx="3" fill="#ff8a65"><animate attributeName="height" values="120;80;120" dur="3.3s" repeatCount="indefinite"/><animate attributeName="y" values="-120;-80;-120" dur="3.3s" repeatCount="indefinite"/></rect>
    <rect x="170" y="-150" width="26" height="150" rx="3" fill="#ef5350"><animate attributeName="height" values="150;120;150" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="-150;-120;-150" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>
  <rect y="0" width="140" height="220" fill="url(#scan)">
    <animate attributeName="x" values="-140;900" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
